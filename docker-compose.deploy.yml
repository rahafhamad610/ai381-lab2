# Lab 3, Part 6 (local option): run the champion image on your own laptop.
#   docker build --build-arg GIT_SHA=$(git rev-parse HEAD) -t churn-api:local .
#   docker compose -f docker-compose.deploy.yml up -d
#   bash scripts/smoke_test.sh http://localhost:8000
# "restart: unless-stopped" is the local version of self-healing: if the service crashes, Docker starts it again.
# The image already has a HEALTHCHECK, so `docker compose ps` shows "healthy" when the service answers /health.
services:
  api:
    image: ${IMAGE:-churn-api:local}
    ports:
      - "8000:8000"
    restart: unless-stopped
